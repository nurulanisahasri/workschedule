<div class="modal-overlay" (click)="closePopup()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Book {{ workspace?.name }}</h3>
      <button class="close-btn" (click)="closePopup()" aria-label="Close modal">×</button>
    </div>
    <div class="modal-body">
      <form (ngSubmit)="bookNow()">
        <div class="form-group">
          <label for="date">Date *</label>
          <input
            type="date"
            id="date"
            [(ngModel)]="bookingForm.date"
            name="date"
            required>
        </div>
        <div class="form-group">
          <label for="time">Time *</label>
          <div class="time-picker-row">
            <select
              id="time-hour"
              [(ngModel)]="timeHour"
              name="timeHour"
              (change)="updateTimeFromSelects('time')"
              required>
              <option value="">Hour</option>
              <option *ngFor="let h of hours" [value]="h">{{ h }}</option>
            </select>
            <select
              id="time-minute"
              [(ngModel)]="timeMinute"
              name="timeMinute"
              (change)="updateTimeFromSelects('time')"
              required>
              <option value="">Minutes</option>
              <option value="00">00</option>
              <option value="30">30</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="endTime">End Time *</label>
          <div class="time-picker-row">
            <select
              id="endTime-hour"
              [(ngModel)]="endTimeHour"
              name="endTimeHour"
              (change)="updateTimeFromSelects('endTime')"
              required>
              <option value="">Hour</option>
              <option *ngFor="let h of hours" [value]="h">{{ h }}</option>
            </select>
            <select
              id="endTime-minute"
              [(ngModel)]="endTimeMinute"
              name="endTimeMinute"
              (change)="updateTimeFromSelects('endTime')"
              required>
              <option value="">Minutes</option>
              <option value="00">00</option>
              <option value="30">30</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label for="notes">Notes</label>
          <textarea
            id="notes"
            [(ngModel)]="bookingForm.notes"
            name="notes"
            placeholder="Add any additional notes..."></textarea>
        </div>
        
        <div class="form-group price-info">
          <p>Duration: <strong>{{ durationInHours }} hour(s)</strong></p>
          <p>Total Price: <strong>${{ totalPrice | number:'1.2-2' }}</strong></p>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-cancel" (click)="closePopup()">Cancel</button>
          <button type="submit" class="btn-confirm">Confirm Booking</button>
        </div>
      </form>
    </div>
  </div>
</div>
